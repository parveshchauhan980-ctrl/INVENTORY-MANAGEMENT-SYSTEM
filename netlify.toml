[build]
  command = "npm run build"
  publish = "dist"

# Optional backend proxy: if hosting backend separately on Render/Railway/Fly/VPS,
# uncomment the redirect below and replace with your backend URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
